name: Metal probe

# Does a GitHub-hosted macOS runner expose a Metal GPU to jobs? Checks MPS
# availability and actually runs a compute shader, not just the availability flag.
on:
  workflow_dispatch:
  push:
    branches: [ci/metal-probe]
    paths: [".github/workflows/metal-probe.yml"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hardware
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType || true

      - name: Install torch
        run: pip install torch numpy

      - name: MPS availability and compute shader
        run: |
          python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("mps built:", torch.backends.mps.is_built())
          print("mps available:", torch.backends.mps.is_available())
          if not torch.backends.mps.is_available():
              raise SystemExit(0)
          x = torch.arange(8, dtype=torch.float32, device="mps")
          print("matmul ok:", (x @ x).item())
          lib = torch.mps.compile_shader("""
          using namespace metal;
          kernel void add_one(device float* a [[buffer(0)]], uint i [[thread_position_in_grid]]) { a[i] += 1.0; }
          kernel void atomic_acc(device atomic_float* a [[buffer(0)]], uint i [[thread_position_in_grid]]) {
              atomic_fetch_add_explicit(a, 1.0f, memory_order_relaxed);
          }
          """)
          lib.add_one(x)
          torch.mps.synchronize()
          print("compile_shader add_one:", x.tolist())
          acc = torch.zeros(1, device="mps")
          lib.atomic_acc(acc, threads=1024)
          torch.mps.synchronize()
          print("relaxed float atomics (expect 1024):", acc.item())
          assert acc.item() == 1024.0
          PY
